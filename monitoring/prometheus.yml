global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # DBaaS Backend API metrics
  - job_name: 'dbaas-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Sample database metrics (if exporters are configured)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-sample:3306']
    scrape_interval: 30s

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo-sample:27017']
    scrape_interval: 30s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
