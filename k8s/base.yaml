# Namespace for DBaaS System
apiVersion: v1
kind: Namespace
metadata:
  name: dbaas-system
  labels:
    name: dbaas-system
    tier: platform

---
# Namespace for Database Instances
apiVersion: v1
kind: Namespace
metadata:
  name: dbaas-databases
  labels:
    name: dbaas-databases
    tier: databases

---
# Namespace for Monitoring
apiVersion: v1
kind: Namespace
metadata:
  name: dbaas-monitoring
  labels:
    name: dbaas-monitoring
    tier: monitoring

---
# Storage Classes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/gce-pd  # Change based on your cloud provider
parameters:
  type: pd-ssd
  replication-type: regional-pd
allowVolumeExpansion: true
reclaimPolicy: Retain

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-hdd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/gce-pd  # Change based on your cloud provider
parameters:
  type: pd-standard
  replication-type: regional-pd
allowVolumeExpansion: true
reclaimPolicy: Delete

---
# Resource Quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dbaas-system-quota
  namespace: dbaas-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dbaas-databases-quota
  namespace: dbaas-databases
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "100"
    services: "50"
    secrets: "100"
    configmaps: "50"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dbaas-monitoring-quota
  namespace: dbaas-monitoring
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "10"
    services: "5"

---
# Limit Ranges
apiVersion: v1
kind: LimitRange
metadata:
  name: dbaas-system-limits
  namespace: dbaas-system
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container

---
apiVersion: v1
kind: LimitRange
metadata:
  name: dbaas-databases-limits
  namespace: dbaas-databases
spec:
  limits:
  - default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "250m"
      memory: "512Mi"
    type: Container

---
# Pod Security Policy (if using PSP)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: dbaas-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: false
